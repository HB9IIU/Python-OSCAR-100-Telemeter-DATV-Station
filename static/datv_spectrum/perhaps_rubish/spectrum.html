    <script>
    var TX = false;
    var OBS_connection_status = false;

    function react_on_symbol_rate_click(value) {
        switch (value) {
            case "SR66":
                symbol_rate_daniel = 66;
                break;
            case "SR125":
                symbol_rate_daniel = 125;
                break;
            case "SR250":
                symbol_rate_daniel = 250;
                break;
            case "SR333":
                symbol_rate_daniel = 333;
                break;
            case "SR500":
                symbol_rate_daniel = 500;
                break;
            case "SR1000":
                symbol_rate_daniel = 1000;
                break;
            case "SR1500":
                symbol_rate_daniel = 1500;
        }
        console.log("Clicked", value, symbol_rate_daniel)
        document.getElementById("label_symbol_rate").innerHTML = symbol_rate_daniel.toFixed(0) + " kS";

    }

    function transmit() {
        console.log("Transmit");
        TX=true;
        // we first check if OBS is connected
        if (OBS_Connection_Status == false) {
            $('#Connect_to_OBS_Modal').modal('show');
            return
        }
        // hiding the 'Start' button
        document.getElementById("button_start").className = "btn btn-secondary d-none";
        // un-hiding the 'Preparing' button
        document.getElementById("button_preparing").className = "btn btn-warning ";
        let sr = 0;
        let f = 0;
        if ($('#SR66').prop('checked')) {
            sr = 66
        }
        if ($('#SR125').prop('checked')) {
            sr = 125
        }
        if ($('#SR250').prop('checked')) {
            sr = 250
        }
        if ($('#SR333').prop('checked')) {
            sr = 333
        }
        if ($('#SR500').prop('checked')) {
            sr = 500
        }
        if ($('#SR1000').prop('checked')) {
            sr = 1000
        }

TX_frequency=document.getElementById("label_uplink_frequency").innerHTML;
        const data_array_for_Python = [TX_frequency, sr, fec];
        console.log("Arry to Python:", data_array_for_Python);
        $.ajax({
            url: '/askpython',
            type: "POST",
            data: JSON.stringify({
                Instruction: "Start Transmit OBS stream",
                Argument_1: data_array_for_Python,
                Argument_2: 0
            }),
            contentType: 'application/json;charset=UTF-8',
            // If we receive a reply from server
            success: function (response) {
                TX = true // need to find for what this is
                // hiding the 'Preparing' button
                document.getElementById("button_preparing").className = "btn btn-warning d-none";
                // un-hiding the 'Broadcasting' button
                document.getElementById("button_broadcasting").className = "btn btn-danger";
                console.log("Response:", response)
                // enabling the slider
                $("#Power_Slider").data("ionRangeSlider").update({disable: false});
                //un-hidding the Auto button
                document.getElementById("autopower_start").className = "btn btn-success ";
                document.getElementById("bouton_plus").className = "btn btn-light";
                document.getElementById("bouton_moins").className = "btn btn-light";
            }
        })

    }


    function spectrum_display() {
        $("#wf").show(0);
        $("#no_wf").hide(0);
        jQuery.getScript("wf.js");
    }


    $(document).ready(function () {
        console.log("Document Ready")
        spectrum_display();
    })

</script>
