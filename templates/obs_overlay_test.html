<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>DATVSM</title>
    <link href="/static/img/favicon.ico" rel="icon" type="image/x-icon"/>
    <link href="/static/fonts/fonts.css" rel="stylesheet"/>
    <!-- javascript for gauges -->
    <script src="/static/js/gauge.min.js"></script>
    <!-- jquery -->
    <script src="/static/js/jquery.min.js"></script>
     <!-- Google fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Aldrich&display=swap"/>
</head>
<body>
<canvas id="Thermo_Meter_Room"></canvas>
</body>
<script>
    const colorPlate = "#00000800";
    const fontUnitsSize = 55;
    const fontNumbersSize = 26;
    const colorNumbers = "rgb(255,255,255)";
    const colorValueText = "rgb(255,255,255)";
    const colorUnits = "rgb(255,255,255)";
    const colorBar= '#ececec';
    const colorBarProgress='#d1d1d1';
    const colorMinorTicks= "#8c8989";
    const fontUnits='Aldrich';

    var THERMOMETER_ROOM = new RadialGauge({
        renderTo: 'Thermo_Meter_Room',
        colorPlate: colorPlate,
        height: 400,
        units: "°C",
        minValue: -5,
        maxValue: 35,
        majorTicks: [-5, 0, 5, 10, 15, 20, 25, 30, 35],
        startAngle: 90,
        ticksAngle: 180,
        needleEnd: 95,
        needleShadow: true,
        barWidth: 6,
        colorBar: colorBar,
        colorBarProgress:colorBarProgress,
        borders: false,
        borderShadowWidth: 0,
        strokeTicks: true,
        valueBox: false,
        value: -5,
        animationRule: 'linear',
        animationDuration: 0,
        colorMinorTicks: colorMinorTicks,
        fontNumbers: "Led",
        fontUnits: fontUnits,
        fontUnitsSize: 55,
        fontNumbersSize: 26,
        fontNumbers: fontUnits,
        fontUnitsStyle: "bold",
        colorNumbers:colorNumbers,
        colorValueText:colorValueText,
        colorUnits:colorUnits,
        highlights: [{from: -5, to: 0, color: "rgb(241,0,0)"},
            {from: 0, to: 25, color: "rgb(80,241,0)"},
            {from: 25, to: 35, color: "rgb(241,221,0)"}
        ],
        highlightsWidth: 10,
        valueDec: 2,
    })


    function get_all_values() {

        $.ajax({
            url: '/askpython',
            type: "POST",
            data: JSON.stringify({
                Instruction: "get_data",
                Argument_1: 0,
                Argument_2: 0
            }),
            contentType: 'application/json;charset=UTF-8',
            // If we receive a reply from server
            success: function (response) {
                //console.log(response);
                Voltage = response.Voltage.toFixed(1)
                Current = response.Current.toFixed(1)
                Temperature_PA = response.Temperature_PA.toFixed(1)
                Temperature_Ambient = response.Temperature_Ambient.toFixed(1)
                THERMOMETER_ROOM.value=Temperature_Ambient
                //THERMOMETER_ROOM.update({units: "AIR: "+Temperature_Ambient + ' °C'});
                THERMOMETER_ROOM.update({units: Temperature_Ambient + ' °C'});
            }
        })
    }

    async function init_instruments() {
        var meter_animation_duration = 300;
        THERMOMETER_ROOM.update({animationDuration: meter_animation_duration});
        THERMOMETER_ROOM.draw();
        THERMOMETER_ROOM.value = THERMOMETER_ROOM.options.maxValue;
        await sleepNow(meter_animation_duration)
        THERMOMETER_ROOM.value = THERMOMETER_ROOM.options.minValue;
        await sleepNow(meter_animation_duration)
        meter_animation_duration = 1000
        THERMOMETER_ROOM.update({animationDuration: meter_animation_duration});

        get_all_values()
        setInterval(function () {
            get_all_values()
        }, 1000);
    }

    window.addEventListener('load', function () {
        document.fonts.ready
        init_instruments()
    });
    const sleepNow = (delay) => new Promise((resolve) => setTimeout(resolve, delay))

</script>
</html>
